roofing_vocabulary_notes: >-
  The active vocabulary changes over time: EZRO ('EZ REROOF RESIDENTIAL') returned 0
  rows for 2026-08 but 211 rows for 2022-10, and C202/R200 (hurricane reroof) are
  event-driven. A historical sweep must iterate every roofing code across the whole
  period rather than only the codes that are active today.

